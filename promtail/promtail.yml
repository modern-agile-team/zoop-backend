server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s

    relabel_configs:
      # 컨테이너 이름 -> container 라벨 (앞의 "/" 제거)
      - source_labels: [__meta_docker_container_name]
        regex: '/(.*)'
        target_label: container

      # 이미지 태그 -> image 라벨
      - source_labels: [__meta_docker_container_image]
        target_label: image

      # compose 서비스/프로젝트/번호 라벨
      - source_labels:
          [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels:
          [__meta_docker_container_label_com_docker_compose_project]
        target_label: compose_project
      - source_labels:
          [__meta_docker_container_label_com_docker_compose_container_number]
        target_label: compose_number

      # 컨테이너 ID로 실제 로그 파일 경로 지정
      - source_labels: [__meta_docker_container_id]
        target_label: __path__
        replacement: /var/lib/docker/containers/$1/*-json.log
